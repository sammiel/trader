name: tick
# Live paper-trading loop: every 15 minutes (GitHub may delay scheduled runs by a few minutes).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/tick.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Skip if the loop engine is running
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow loop.yml --status in_progress --json databaseId --jq length 2>/dev/null || echo 0)
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one tick
        run: python -m bot.run
      - name: Save state
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add state docs || true
          git diff --cached --quiet && exit 0
          git commit -q -m "tick $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
