name: loop
# Reliable 15-minute engine: one job ticks every 15 minutes for ~5h40m, then
# starts the next loop. Use it when GitHub's cron schedule is unreliable.
# It keeps a runner busy around the clock (~1,440 Actions minutes a day), so
# only run it on a public repo (free minutes) or a plan with enough minutes.
# Start: Actions tab -> loop -> Run workflow (or the API). Stop: cancel the run.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tick every 15 minutes
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 20400 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase -X theirs origin main || git rebase --abort || true
            python -m bot.run || true
            git add state docs || true
            if ! git diff --cached --quiet; then
              git commit -q -m "tick (loop) $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do
                git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break
                sleep $((i*5))
              done
            fi
            if grep -q '"test window over' state/events.log 2>/dev/null && [ "$(date -u +%Y%m%d%H%M)" -gt 202611062130 ]; then exit 0; fi
            sleep $(( 900 - $(date +%s) % 900 + 20 ))
          done
      - name: Start the next loop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d%H%M)" -lt 202611062200 ]; then gh workflow run loop.yml --ref main; fi
