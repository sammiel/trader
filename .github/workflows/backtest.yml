name: backtest
# Re-runs the historical test whenever strategy code changes; decides which
# strategies are allowed to trade paper capital (state/enabled.json).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/strategies.py", "bot/config.py", "bot/backtest.py", "bot/portfolio.py",
            ".github/workflows/backtest.yml"]

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest
        run: python -m bot.backtest
      - name: Save results
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add backtests state/enabled.json || true
          git diff --cached --quiet && exit 0
          git commit -q -m "backtest $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
